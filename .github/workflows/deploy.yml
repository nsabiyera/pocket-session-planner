name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages source must be set to "GitHub Actions" in repository settings, not a branch.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a running one half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `enablement` turns Pages on with this workflow's own token rather than requiring
      # someone with admin to flip Settings -> Pages by hand first. Without it the very
      # first deploy of a fresh repository fails on `Get Pages site failed ... Not Found`,
      # which reads like a broken workflow rather than an unconfigured repository.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
